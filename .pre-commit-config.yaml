# Pre-commit hooks for pyALDIC-3D.
#
# Mirrors the 2D repo's tooling (ruff + standard hygiene). The GUI and its tr()
# strings have shipped since 1.0.0 (8 locales), but i18n is deliberately not a
# hook: extracting, filling and compiling catalogs rewrites .ts/.qm files and
# needs PySide6's lupdate/lrelease, so it runs by hand (CONTRIBUTING.md:
# tools/i18n.py extract|compile|scan, tools/fill_translations.py).
#
# CI's lint job (.github/workflows/ci.yml) installs the same ruff version as
# the rev below -- bump the two together.
#
# Setup:   pip install -e ".[dev]" && pre-commit install
# Run all: pre-commit run --all-files
# Bump:    pre-commit autoupdate

# The quickstart dataset is committed byte for byte as published (Stereo-DIC
# Challenge 1.0, Sample 3): 2.3 MB TIFFs and a DICe calibration file with
# trailing spaces. No hook may flag or "fix" it.
exclude: ^quickstart/(left|right|masks)/|^quickstart/calibration\.xml$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20  # keep in lockstep with the lint job in .github/workflows/ci.yml
    hooks:
      - id: ruff          # lint
        args: ["--fix"]
      - id: ruff-format   # format
