name: Publish to PyPI

# Publishes when a version tag is pushed. Uses PyPI Trusted Publishing
# (OpenID Connect), so there is no API token to paste, store or rotate:
# PyPI verifies the workflow's short-lived identity instead.
#
# One-time setup on PyPI (Your projects -> al-dic-3d -> Publishing, or a
# *pending* publisher before the first release — see docs/RELEASING.md):
#   Owner            zachtong
#   Repository       pyALDIC-3D
#   Workflow         publish.yml
#   Environment      pypi
#
# Release flow after that:
#   git tag -a v1.0.0 -m "..." && git push origin v1.0.0
#   -> this builds, checks and publishes, then attaches the artifacts
#      to the GitHub Release for that tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # manual re-run, e.g. after a failed publish

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        # The version is hatchling-dynamic: pyproject.toml has no
        # [project].version — the single source of truth is __version__ in
        # src/al_dic_3d/__init__.py, so read it from there.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/al_dic_3d/__init__.py').read_text()).group(1))")
          echo "tag=$TAG  __init__.py=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package version $PKG"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # gate releases behind an environment rule if wanted
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password / token: the action exchanges GitHub's OIDC identity
        # for a short-lived PyPI credential.
        with:
          # A version already on PyPI is skipped rather than failing the run,
          # so re-running after a partial publish is safe -- and a manual
          # dispatch can verify the trusted-publisher setup without needing a
          # new version to push.
          skip-existing: true

  attach:
    name: Attach artifacts to the GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')   # no release exists for a manual run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release for this tag (if missing) and upload
        env:
          GH_TOKEN: ${{ github.token }}
        # Creating the GitHub *Release* (not just the tag) is what triggers the
        # Zenodo DOI mint once the GitHub-Zenodo integration is enabled — see
        # docs/RELEASING.md. Re-run safe: an existing release is reused and
        # --clobber overwrites previously uploaded artifacts.
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
