name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the 2D repo's support matrix (01 §G). Development happens on
        # 3.13, but CI pins to the classified range.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # `al-dic==0.6.*` resolves from PyPI (published). It transitively pulls
        # the full 2D stack (PySide6, numba, ...), but the Phase 0 skeleton
        # imports NONE of it, so no Qt system libraries are needed yet. Add
        # `sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3` when the
        # GUI phase (01 §G, P4) starts importing `al_dic.gui`.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Lint/format are NOT run here: this mirrors the 2D repo's pytest-only CI
      # and keeps CI to exactly the Phase 0 gate (import / --help / tests). Style
      # is enforced by the pinned pre-commit hooks (.pre-commit-config.yaml), so a
      # new ruff release cannot red an otherwise-unchanged build.

      - name: Gate — import al_dic_3d
        run: python -c "import al_dic_3d; print('al_dic_3d', al_dic_3d.__version__)"

      - name: Gate — al-dic-3d --help
        run: al-dic-3d --help

      - name: Gate — test suite
        run: pytest --tb=short -q -m "not perf"
