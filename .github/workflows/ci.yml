name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned to the rev in .pre-commit-config.yaml -- bump the two together,
        # so a new ruff release cannot turn an unchanged tree red.
        run: python -m pip install "ruff==0.15.20"

      - name: ruff check
        run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Alien-environment matrix (G3): every desktop OS x the endpoints of
        # the classified Python range (01 §G: 3.10-3.12; 3.11 sits between the
        # endpoints and adds no distinct wheel/ABI surface worth a 7th job).
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    env:
      # Headless Qt everywhere — the exact mode the GUI tests use locally.
      # pyvista/VTK are core dependencies (since 1.0.0), so they are installed
      # here too. Linux runners render VTK offscreen (EGL); hosted Windows and
      # macOS runners have no usable OpenGL, so tests/conftest.py skips the
      # plotter-creating tests there, and View3D's no-GL degradation path is
      # covered by tests/test_view3d_degradation.py without any OpenGL context.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        # PySide6 wheels bundle Qt but dlopen these system libraries even on
        # the offscreen platform. fonts-dejavu-core + QT_QPA_FONTDIR gives the
        # offscreen renderer real glyphs (mirrors the tests' Windows FONTDIR).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libglib2.0-0 libfontconfig1 libxrender1 \
            fonts-dejavu-core
          echo "QT_QPA_FONTDIR=/usr/share/fonts/truetype/dejavu" >> "$GITHUB_ENV"

      - name: Install dependencies
        # al-dic resolves from PyPI to the newest release inside the range
        # pyproject.toml declares (the `bounds` job below pins each end); the
        # sibling 2D repo is never touched in CI. [dev] brings pytest,
        # pytest-xdist, ruff, pre-commit, PySide6, psutil and h5py.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Lint runs once, in the `lint` job above, not on every matrix leg.

      - name: Gate — import al_dic_3d
        run: python -c "import al_dic_3d; print('al_dic_3d', al_dic_3d.__version__)"

      - name: Gate — al-dic-3d --help
        run: al-dic-3d --help

      - name: Gate — test suite
        # -m "not perf": throughput tests are excluded (runner CPU varies).
        # Dataset-bound tests (MATLAB reference repo, real examples) skip
        # themselves when the local data is absent — CI runs synthetic-only.
        run: pytest --tb=short -q -m "not perf"

  bounds:
    # A declared dependency range is only a promise until both of its ends are
    # installed and tested. The matrix above always gets the newest in-range
    # releases; these legs pin the ends of the ranges pyproject.toml declares.
    name: deps (${{ matrix.bound }} bound, ubuntu, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - bound: lower
            # The oldest al-dic in range, and the OpenCV 4.x line
            # (calibration/geometry.py has a 4.x code path).
            pins: '"al-dic==0.7.2" "opencv-python>=4.7,<5"'
          - bound: upper
            # The newest al-dic minor the range admits.
            pins: '"al-dic>=0.8,<0.9"'

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        # Same system libraries and fonts as the Linux leg of the matrix.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libglib2.0-0 libfontconfig1 libxrender1 \
            fonts-dejavu-core
          echo "QT_QPA_FONTDIR=/usr/share/fonts/truetype/dejavu" >> "$GITHUB_ENV"

      - name: Install with the ${{ matrix.bound }} bound
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ${{ matrix.pins }}

      - name: Resolved versions
        run: >-
          python -c "import al_dic, cv2, numpy;
          print('al-dic', al_dic.__version__, '| opencv', cv2.__version__,
          '| numpy', numpy.__version__)"

      - name: Test suite
        run: pytest -m "not perf" -x -q
