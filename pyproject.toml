[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "al-dic-3d"
dynamic = ["version"]  # read from src/al_dic_3d/__init__.py (see [tool.hatch.version])
description = "pyALDIC-3D: stereo / multi-camera Digital Image Correlation built on the pyALDIC-2D engine"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "Zixiang (Zach) Tong", email = "zachtong@utexas.edu" },
]
keywords = [
    "digital-image-correlation",
    "stereo-DIC",
    "3D-DIC",
    "DIC",
    "experimental-mechanics",
    "strain-measurement",
    "photogrammetry",
    "triangulation",
    "surface-strain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    # License metadata lives once in the SPDX `license` field above (PEP 639);
    # no `License ::` trove classifier, which PEP 639 discourages duplicating.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    # OpenCV: the SAME distribution al-dic depends on. Declaring the headless
    # variant as well installed two packages that both own the `cv2` module
    # (OpenCV's docs: install exactly one). 4.x and 5.x are both supported —
    # calibration/geometry.py picks undistortPointsIter on 4.x.
    "opencv-python>=4.7",
    # pyALDIC-2D consumed as a READ-ONLY library (decision D11), bounded to the
    # minor versions the suite is verified against: 0.7.2 (first with partial
    # results) through 0.8.x (engine modules we import are byte-identical to
    # 0.7.2; 0.8 adds the numba-cache fallback). During development an editable
    # install of the sibling repo satisfies the same range:
    #     pip install -e ../pyALDIC
    # docs/DEPENDS_ON_2D.md is the ledger of exactly which al_dic symbols we use.
    "al-dic>=0.7.2,<0.9",
    # Imported directly by this package (not only through al-dic).
    "matplotlib>=3.6",   # export/colorbar.py, viz3d/fieldmap.py, calibration/printout.py
    "numba>=0.57",       # strain3d/kernels.py
    "pillow>=9.1",       # export/gifstream.py (streamed GIF export, fix batch V)
    # TOML config parsing: stdlib tomllib exists only from Python 3.11; the
    # API-identical tomli backport covers 3.10 (see the conditional import in
    # runner.py). Without this, 1.0.0 was unimportable on py3.10.
    'tomli>=2.0; python_version < "3.11"',
    # Full-featured by default (user decision 2026-07-29): a bare
    # `pip install al-dic-3d` ships the desktop GUI and the 3D view — the
    # target audience is GUI users, and a partial install that boots without
    # its headline features costs more support than the extra download.
    # Imports stay lazy, so headless/CLI use still works where Qt or OpenGL
    # cannot initialize.
    "PySide6>=6.5",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]

[project.optional-dependencies]
# Compatibility aliases: these packages are CORE dependencies since v1.0.0;
# `pip install "al-dic-3d[gui,viz3d]"` from older docs keeps working.
gui = [
    "PySide6>=6.5",
]
viz3d = [
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "pre-commit>=3.5",
    "PySide6>=6.5",  # GUI smoke tests (offscreen)
    "psutil>=5.9",   # tools/stress_test.py RSS sampling
    "h5py>=3.0",     # tools/matlab_parity.py reads the v7.3 MATLAB baseline
]

[project.urls]
Homepage = "https://github.com/zachtong/pyALDIC-3D"
Repository = "https://github.com/zachtong/pyALDIC-3D"
Issues = "https://github.com/zachtong/pyALDIC-3D/issues"

[project.scripts]
al-dic-3d = "al_dic_3d.cli:main"

[tool.hatch.version]
# Single source of truth for the version — no pyproject/__init__ drift.
path = "src/al_dic_3d/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/al_dic_3d"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist (hatchling's default "everything not gitignored" would sweep
# in local docs/data). Keep the sdist to what a consumer needs to install + test.
include = [
    "/src",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/docs",
    "/.github/workflows",
]
# NOT included on purpose: examples/ (13 MB of sample tifs), assets/ (README
# screenshots), tools/, reports/, reference/ — the sdist stays install+test lean.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "perf: performance/throughput tests -- excluded from CI (runner CPU varies)",
]

[tool.coverage.run]
source = ["al_dic_3d"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Lean, high-signal rule set for the scaffold; tighten as modules land.
#   E,W pycodestyle · F pyflakes · I isort · UP pyupgrade · B bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
# ruff's Black-compatible formatter with defaults.
